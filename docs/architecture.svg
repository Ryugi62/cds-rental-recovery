<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15">
  <rect width="1200" height="620" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#191f28"/></marker>
  </defs>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#191f28">cds-rental-recovery: every send passes the gate; every event changes the next decision</text>

  <!-- customer -->
  <rect x="24" y="250" width="150" height="110" rx="14" fill="#f2f4f6" stroke="#191f28"/>
  <text x="99" y="285" text-anchor="middle" font-weight="700">Customer</text>
  <text x="99" y="310" text-anchor="middle">email inbox</text>
  <text x="99" y="332" text-anchor="middle">phone (SMS)</text>

  <!-- AWS CDS: SES and End User Messaging only -->
  <rect x="220" y="70" width="210" height="460" rx="16" fill="#fff7e6" stroke="#d48806"/>
  <text x="325" y="96" text-anchor="middle" font-weight="700" fill="#8a5a00">AWS CDS</text>
  <rect x="240" y="110" width="170" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-width="2"/>
  <text x="325" y="140" text-anchor="middle" font-weight="700">Amazon SES</text><text x="325" y="162" text-anchor="middle">send + config set</text>
  <rect x="240" y="210" width="170" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-width="2"/>
  <text x="325" y="240" text-anchor="middle" font-weight="700">End User Messaging</text><text x="325" y="262" text-anchor="middle">SMS, simulator nos.</text>
  <rect x="240" y="440" width="170" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-dasharray="7 5"/>
  <text x="325" y="470" text-anchor="middle" font-weight="700">SES receiving</text><text x="325" y="492" text-anchor="middle">receipt rule (domain)</text>

  <!-- core -->
  <rect x="480" y="70" width="696" height="110" rx="16" fill="#e8f3ff" stroke="#3182f6" stroke-width="2"/>
  <text x="828" y="96" text-anchor="middle" font-weight="700" fill="#1b64da">RecoveryService (domain + application, unit-tested)</text>
  <rect x="500" y="110" width="180" height="54" rx="10" fill="#fff" stroke="#191f28" stroke-width="2"/>
  <text x="590" y="133" text-anchor="middle" font-weight="700">Outbound gate</text><text x="590" y="153" text-anchor="middle" font-size="14">4 verdicts, 1 path</text>
  <rect x="720" y="110" width="180" height="54" rx="10" fill="#fff" stroke="#191f28" stroke-width="2"/>
  <text x="810" y="133" text-anchor="middle" font-weight="700">Event decisions</text><text x="810" y="153" text-anchor="middle" font-size="14">block, opt-out, nudge</text>
  <rect x="960" y="110" width="196" height="54" rx="10" fill="#fff" stroke="#191f28" stroke-width="2"/>
  <text x="1058" y="133" text-anchor="middle" font-weight="700">Reply reader</text><text x="1058" y="153" text-anchor="middle" font-size="14">qty, date vs ledger</text>

  <!-- events and inbound paths -->
  <rect x="480" y="210" width="150" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-dasharray="7 5"/>
  <text x="555" y="240" text-anchor="middle" font-weight="700">Amazon SNS</text><text x="555" y="262" text-anchor="middle">events topic</text>
  <rect x="690" y="210" width="150" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-width="2"/>
  <text x="765" y="240" text-anchor="middle" font-weight="700">Lambda</text><text x="765" y="262" text-anchor="middle">events_handler</text>
  <rect x="480" y="440" width="150" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-dasharray="7 5"/>
  <text x="555" y="470" text-anchor="middle" font-weight="700">Amazon SNS</text><text x="555" y="492" text-anchor="middle">inbound topic</text>
  <rect x="690" y="440" width="150" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-dasharray="7 5"/>
  <text x="765" y="470" text-anchor="middle" font-weight="700">Lambda</text><text x="765" y="492" text-anchor="middle">inbound_handler</text>

  <rect x="980" y="210" width="176" height="74" rx="12" fill="#f2f4f6" stroke="#191f28" stroke-width="2"/>
  <text x="1068" y="236" text-anchor="middle" font-weight="700">Ledger</text><text x="1068" y="256" text-anchor="middle" font-size="14">posting or</text><text x="1068" y="274" text-anchor="middle" font-size="14">hand-off item</text>

  <!-- Other AWS: CloudWatch, Bedrock, AgentCore (outside the CDS box) -->
  <rect x="480" y="312" width="696" height="110" rx="16" fill="#f9fafb" stroke="#8b95a1"/>
  <text x="1160" y="332" text-anchor="end" font-weight="700" fill="#4e5968">Other AWS</text>
  <rect x="500" y="340" width="180" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-width="2"/>
  <text x="590" y="370" text-anchor="middle" font-weight="700">CloudWatch</text><text x="590" y="392" text-anchor="middle">SES + SMS metrics</text>
  <rect x="720" y="340" width="180" height="70" rx="12" fill="#fff" stroke="#191f28" stroke-width="2"/>
  <text x="810" y="370" text-anchor="middle" font-weight="700">Amazon Bedrock</text><text x="810" y="392" text-anchor="middle">assist, conf &lt; 0.8</text>
  <rect x="980" y="340" width="176" height="70" rx="12" fill="#fff" stroke="#8b95a1" stroke-dasharray="2 4"/>
  <text x="1068" y="370" text-anchor="middle" font-weight="700" fill="#4e5968">AgentCore</text><text x="1068" y="392" text-anchor="middle" fill="#4e5968" font-size="14">planned, same gate</text>

  <!-- arrows: sends -->
  <path d="M500 137 L414 137" stroke="#191f28" stroke-width="2" marker-end="url(#a)"/>
  <path d="M500 160 Q460 200 414 238" stroke="#191f28" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M240 150 Q190 180 150 248" stroke="#191f28" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M240 255 L178 288" stroke="#191f28" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M110 362 Q150 470 236 475" stroke="#191f28" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>
  <!-- arrows: events -->
  <path d="M411 172 Q450 195 477 228" stroke="#191f28" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>
  <path d="M411 262 L477 262" stroke="#191f28" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M411 178 C 462 205, 458 300, 548 337" stroke="#191f28" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M411 274 Q 452 300 512 337" stroke="#191f28" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M632 245 L687 245" stroke="#191f28" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M780 208 L790 167" stroke="#191f28" stroke-width="2" marker-end="url(#a)"/>
  <path d="M682 350 C 648 300, 652 200, 728 167" stroke="#191f28" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <!-- arrows: replies -->
  <path d="M411 475 L477 475" stroke="#191f28" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M632 475 L687 475" stroke="#191f28" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M842 470 C 945 470, 940 250, 990 167" stroke="#191f28" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>
  <path d="M1068 164 L1068 207" stroke="#191f28" stroke-width="2" marker-end="url(#a)"/>
  <path d="M960 150 Q 905 240 845 337" stroke="#191f28" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="480" y="546" width="696" height="50" rx="12" fill="#ffffff" stroke="#e5e8eb"/>
  <path d="M498 571 L538 571" stroke="#191f28" stroke-width="2"/><text x="548" y="576">run live on AWS (docs/live)</text>
  <path d="M768 571 L808 571" stroke="#191f28" stroke-dasharray="7 5"/><text x="818" y="576">code + tests, not deployed</text>
  <path d="M1030 571 L1070 571" stroke="#8b95a1" stroke-dasharray="2 4"/><text x="1080" y="576" fill="#4e5968">planned</text>
</svg>
